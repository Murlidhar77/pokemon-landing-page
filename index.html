<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokemon Landing Page</title>

    <link rel="stylesheet" href="pokemon.css">
</head>
<body>
    <main class="container">
        <div class="nav">
            <img 
                src="./image/pokemon.png" 
                class="pokemon-logo" 
                alt="Pokemon"
            >
            <img 
                src="./image/menu.png" 
                class="menu" 
                alt="Menu"
            >
        </div>
        <section class="hero">
            <div class="hero-left">

                <div class="content">

                    <p class="small-title">
                        POKEMON GEN 1
                    </p>

                    <h1>
                        Pikachu
                    </h1>

                    <p class="description">
                        Pikachu is an Electric-type Pokémon introduced
                        in Generation I. Pikachu are small, chubby,
                        and incredibly cute mouse-like Pokémon.
                    </p>

                    <div class="pagination">

                        <span class="line"></span>

                        <span>01 / 08</span>

                    </div>

                </div>

                <div class="pokeball">
                    <div class="pokeball-inner"></div>
                </div>

            </div>

            <div class="hero-right"></div>
            <img 
                src="./image/pikachu.png" 
                class="pikachu" 
                alt="Pikachu"
            >
            <div class="dots">

                <span class="active"></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

        </section>

    </main>

</body>
</html>
